name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build ->
# semantic-release -> Docker -> MCP Registry -> security chain lives in
# WYRE-AI/reusable-workflows so every *-mcp repo stays in lockstep instead
# of drifting per-repo. PR-time lint/test gating is test.yml's concern; this
# workflow only runs the release path.
jobs:
  release:
    permissions:
      actions: read # Security Scan: SARIF upload reads run metadata on a private repo
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@508ef4ddcd19285d108423a27f44078a15451575
    with:
      server-name: petra-mcp
      image-name: ghcr.io/wyre-ai/petra-mcp
      fail-on-severity: HIGH,CRITICAL
    secrets: inherit
